# หน้าที่ของไฟล์นี้: เปิดแอปและ PostgreSQL สำหรับพัฒนาในเครื่อง โดยรับค่าลับจาก environment
# ผู้อ่านทั่วไปควรดูคู่มือใน docs ควบคู่กับคอมเมนต์ใกล้กฎสำคัญ
name: yuyen-engineering
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: yuyen
      POSTGRES_USER: yuyen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yuyen -d yuyen"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin-local-only}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  clamav:
    image: clamav/clamav:1.5.3-debian13-slim
    ports:
      - "127.0.0.1:3310:3310"
    volumes:
      - clamav_signatures:/var/lib/clamav
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 15s
      timeout: 5s
      start_period: 90s
      retries: 20
    restart: unless-stopped

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://yuyen:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/yuyen?schema=public
      S3_ENDPOINT: http://minio:9000
      # เบราว์เซอร์เรียก signed URL เอง จึงต้องเป็นชื่อที่เข้าถึงจากเครื่องผู้ใช้ได้ ไม่ใช่ minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_FORCE_PATH_STYLE: "true"
      S3_CONNECTION_TIMEOUT_MS: ${S3_CONNECTION_TIMEOUT_MS:-5000}
      S3_REQUEST_TIMEOUT_MS: ${S3_REQUEST_TIMEOUT_MS:-30000}
      MALWARE_SCAN_MODE: required
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      CLAMAV_TIMEOUT_MS: ${CLAMAV_TIMEOUT_MS:-30000}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      clamav:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  ops:
    build:
      context: .
      target: ops
    profiles: ["tools"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://yuyen:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/yuyen?schema=public
      S3_ENDPOINT: http://minio:9000
      # เบราว์เซอร์เรียก signed URL เอง จึงต้องเป็นชื่อที่เข้าถึงจากเครื่องผู้ใช้ได้ ไม่ใช่ minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_FORCE_PATH_STYLE: "true"
      S3_CONNECTION_TIMEOUT_MS: ${S3_CONNECTION_TIMEOUT_MS:-5000}
      S3_REQUEST_TIMEOUT_MS: ${S3_REQUEST_TIMEOUT_MS:-30000}
      MALWARE_SCAN_MODE: required
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      CLAMAV_TIMEOUT_MS: ${CLAMAV_TIMEOUT_MS:-30000}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      clamav:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
  clamav_signatures:
