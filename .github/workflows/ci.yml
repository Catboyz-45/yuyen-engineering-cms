name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: yuyen_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d yuyen_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CI: true
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/yuyen_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/yuyen_test?schema=public
      APP_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      SESSION_SECRET: ci-only-session-secret-at-least-32-characters
      TOTP_ENCRYPTION_KEY: Y2ktb25seS0zMi1ieXRlLWtleS1mb3ItdGVzdHMtMDA=
      S3_REGION: auto
      S3_FORCE_PATH_STYLE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - name: Validate schema and migration history
        run: |
          npm run db:validate
          npm run db:migrate:deploy
          npm run db:migrate:status
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run build
      - run: npm audit --audit-level=high
      - name: Build production image
        run: docker build --tag yuyen-engineering:ci .

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: yuyen_e2e
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d yuyen_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CI: true
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/yuyen_e2e?schema=public
      # Playwright serves the app on localhost; CSRF origin checks compare against APP_URL.
      APP_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      # Throwaway credentials for the isolated CI database only.
      E2E_ADMIN_USERNAME: e2e-owner
      E2E_ADMIN_PASSWORD: ci-only-temporary-password-1A!
      SESSION_SECRET: ci-only-session-secret-at-least-32-characters
      TOTP_ENCRYPTION_KEY: Y2ktb25seS0zMi1ieXRlLWtleS1mb3ItdGVzdHMtMDA=
      S3_REGION: auto
      S3_FORCE_PATH_STYLE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate && npm run db:migrate:deploy
      - name: Create the first Super Admin for the E2E workflows
        run: npm run auth:bootstrap
        env:
          BOOTSTRAP_ADMIN_USERNAME: ${{ env.E2E_ADMIN_USERNAME }}
          BOOTSTRAP_ADMIN_PASSWORD: ${{ env.E2E_ADMIN_PASSWORD }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
