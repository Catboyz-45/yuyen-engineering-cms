# ตั้งค่า SonarScanner ตามคู่มือใน sonarqube/sonarqube_manual.pdf (หัวข้อ 3)
sonar.projectKey=yuyen-engineering
sonar.projectName=Yuyen Engineering CMS
sonar.sources=.
sonar.exclusions=node_modules/**,.next/**,out/**,coverage/**,playwright-report/**,test-results/**,.scannerwork/**,sonarqube/reports/**,sonarqube/*.pdf,tests/**
# ไฟล์ทดสอบวิเคราะห์ด้วยกฎของโค้ดทดสอบ และไม่ถูกนับเป็นโค้ดที่ต้องมี coverage
sonar.tests=tests
# coverage มาจาก unit + integration test (npm run test:coverage) ซึ่งครอบคลุม src/lib และ src/server
# หน้าเว็บ คอมโพเนนต์ API route และสคริปต์ดูแลระบบตรวจด้วย Playwright E2E และการรันจริง ซึ่งไม่สร้างไฟล์ coverage
# จึงไม่นับในตัวเลข coverage (ยังถูกตรวจหา issue ตามปกติ)
sonar.coverage.exclusions=src/app/**,src/components/**,src/hooks/**,scripts/**,prisma/**,sonarqube/**,**/*.config.*,src/proxy.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.javascript.node.maxspace=4096

# แจ้งเตือนที่ตรวจแล้วว่าไม่ใช่ปัญหา (บอกเหตุผลไว้ทุกข้อ)
# e1: ชื่อเหตุการณ์ เช่น AUTH_PASSWORD_CHANGED กับข้อความภาษาไทย "เปลี่ยนรหัสผ่าน" ไม่ใช่รหัสผ่านที่ฝังในโค้ด
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S2068
sonar.issue.ignore.multicriteria.e1.resourceKey=src/lib/audit-labels.ts
